<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartPark — Live Parking Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0c0f;
      --panel: #0f1217;
      --border: #1e2530;
      --accent: #00e5ff;
      --green: #00ff9d;
      --red: #ff3d71;
      --grey: #3a4455;
      --text: #c8d6e5;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Barlow', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 48px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo { display: flex; align-items: center; gap: 14px; }

    .logo-icon {
      width: 48px; height: 48px;
      background: var(--accent);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
    .logo-text span { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; }

    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    .live-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,255,157,0.08);
      border: 1px solid rgba(0,255,157,0.2);
      padding: 6px 14px; border-radius: 4px;
      font-family: var(--mono); font-size: 12px;
      color: var(--green); letter-spacing: 2px;
    }

    .live-dot {
      width: 8px; height: 8px;
      background: var(--green); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .last-update { font-family: var(--mono); font-size: 11px; color: var(--grey); }

    .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }

    .stat-card {
      background: var(--panel); border: 1px solid var(--border);
      padding: 20px 24px; border-radius: 6px;
      position: relative; overflow: hidden;
    }

    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.total::before { background: var(--accent); }
    .stat-card.available::before { background: var(--green); }
    .stat-card.occupied::before { background: var(--red); }

    .stat-label { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--grey); margin-bottom: 10px; }
    .stat-value { font-size: 42px; font-weight: 800; line-height: 1; color: #fff; }
    .stat-card.available .stat-value { color: var(--green); }
    .stat-card.occupied .stat-value { color: var(--red); }

    .section-title { font-family: var(--mono); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 48px; }

    .slot-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 28px 22px; text-align: center;
      position: relative; transition: transform 0.2s, border-color 0.3s;
      animation: fadeUp 0.4s ease both;
    }

    .slot-card:hover { transform: translateY(-3px); }
    .slot-card.occupied { border-color: rgba(255,61,113,0.4); }
    .slot-card.empty    { border-color: rgba(0,255,157,0.4); }
    .slot-card.unknown  { border-color: var(--border); }

    .slot-visual {
      width: 80px; height: 80px; margin: 0 auto 18px;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 34px;
    }

    .slot-card.occupied .slot-visual { background: rgba(255,61,113,0.1); box-shadow: 0 0 30px rgba(255,61,113,0.15); }
    .slot-card.empty    .slot-visual { background: rgba(0,255,157,0.08); box-shadow: 0 0 30px rgba(0,255,157,0.1); }
    .slot-card.unknown  .slot-visual { background: rgba(58,68,85,0.3); }

    .slot-name { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--grey); margin-bottom: 8px; font-family: var(--mono); }
    .slot-status { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .slot-card.occupied .slot-status { color: var(--red); }
    .slot-card.empty    .slot-status { color: var(--green); }
    .slot-card.unknown  .slot-status { color: var(--grey); }

    .slot-indicator { position: absolute; top: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; }
    .slot-card.occupied .slot-indicator { background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 2s infinite; }
    .slot-card.empty    .slot-indicator { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .slot-card.unknown  .slot-indicator { background: var(--grey); }

    .map-section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 32px; margin-bottom: 40px; }

    .parking-map { display: grid; grid-template-columns: 1fr 80px 1fr; max-width: 600px; margin: 0 auto; }
    .map-lane { display: flex; flex-direction: column; gap: 12px; }

    .map-road {
      background: repeating-linear-gradient(to bottom, transparent, transparent 20px, rgba(255,255,255,0.06) 20px, rgba(255,255,255,0.06) 22px);
      border-left: 2px solid var(--border); border-right: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }

    .road-arrow { font-size: 22px; opacity: 0.3; }

    .map-slot {
      height: 54px; border-radius: 4px; display: flex; align-items: center;
      justify-content: center; gap: 8px; font-family: var(--mono);
      font-size: 12px; font-weight: 600; letter-spacing: 1px;
      border: 1px solid; transition: all 0.4s;
    }

    .map-slot.occupied { background: rgba(255,61,113,0.12); border-color: rgba(255,61,113,0.5); color: var(--red); }
    .map-slot.empty    { background: rgba(0,255,157,0.08); border-color: rgba(0,255,157,0.3); color: var(--green); }
    .map-slot.unknown  { background: transparent; border-color: var(--border); color: var(--grey); }

    .info-section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px 28px; }

    .info-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }

    .info-key { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--grey); text-transform: uppercase; width: 160px; flex-shrink: 0; }
    .info-val { font-family: var(--mono); font-size: 13px; color: var(--accent); }

    .conn-status { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; }
    .conn-dot.ok  { background: var(--green); }
    .conn-dot.err { background: var(--red); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .summary-bar { grid-template-columns: 1fr; }
      .parking-map { grid-template-columns: 1fr 40px 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo">
      <div class="logo-icon">🅿</div>
      <div class="logo-text">
        <h1>SmartPark</h1>
        <span>Live Monitoring System</span>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <div class="last-update" id="lastUpdate">Connecting to Supabase...</div>
    </div>
  </header>

  <div class="summary-bar">
    <div class="stat-card total">
      <div class="stat-label">Total Slots</div>
      <div class="stat-value" id="totalCount">4</div>
    </div>
    <div class="stat-card available">
      <div class="stat-label">Available</div>
      <div class="stat-value" id="availableCount">—</div>
    </div>
    <div class="stat-card occupied">
      <div class="stat-label">Occupied</div>
      <div class="stat-value" id="occupiedCount">—</div>
    </div>
  </div>

  <div class="section-title">// Sensor Readings</div>
  <div class="slots-grid" id="slotsGrid"></div>

  <div class="map-section">
    <div class="section-title">// Parking Layout</div>
    <div class="parking-map" id="parkingMap"></div>
  </div>

  <div class="info-section">
    <div class="section-title">// System Info</div>
    <div class="info-row">
      <span class="info-key">Database</span>
      <span class="info-val">Supabase (sbngkozcyiksqnmeqxaw)</span>
    </div>
    <div class="info-row">
      <span class="info-key">Refresh Rate</span>
      <span class="info-val">Every 3 seconds</span>
    </div>
    <div class="info-row">
      <span class="info-key">Connection</span>
      <span class="info-val">
        <span class="conn-status">
          <span class="conn-dot ok" id="connDot"></span>
          <span id="connText">Connecting...</span>
        </span>
      </span>
    </div>
  </div>

</div>

<script>
  // ── Supabase Config ──────────────────────────────────────────
  const SUPABASE_URL = "https://sbngkozcyiksqnmeqxaw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNibmdrb3pjeWlrc3FubWVxeGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjI5MTksImV4cCI6MjA5MjA5ODkxOX0.K31yDqOCxXWHyZcAwwZ9hOXPjMpp1iRMo2LVXpLRJTU";
  const REFRESH_MS   = 3000;
  // ────────────────────────────────────────────────────────────

  const SLOT_LABELS  = { slot1: "A1", slot2: "A2", slot3: "B1", slot4: "B2" };
  const slotIcon     = s => s === "occupied" ? "🚗" : s === "empty" ? "✅" : "❓";
  const slotEmoji    = s => s === "occupied" ? "🚗" : s === "empty" ? "🟢" : "⬜";

  function buildCards(rows) {
    const grid = document.getElementById("slotsGrid");
    grid.innerHTML = "";
    let occ = 0, avail = 0;

    rows.forEach(row => {
      const status = (row.status || "unknown").toLowerCase();
      const label  = SLOT_LABELS[row.slot_name] || row.slot_name;
      if (status === "occupied") occ++;
      else if (status === "empty") avail++;

      const card = document.createElement("div");
      card.className = `slot-card ${status}`;
      card.innerHTML = `
        <div class="slot-indicator"></div>
        <div class="slot-visual">${slotIcon(status)}</div>
        <div class="slot-name">Slot ${label}</div>
        <div class="slot-status">${status === "unknown" ? "No Signal" : status}</div>
      `;
      grid.appendChild(card);
    });

    document.getElementById("availableCount").textContent = avail;
    document.getElementById("occupiedCount").textContent  = occ;
  }

  function buildMap(rows) {
    const map = document.getElementById("parkingMap");
    const left  = rows.slice(0, 2);
    const right = rows.slice(2, 4);

    const makeSlot = row => {
      const status = (row.status || "unknown").toLowerCase();
      const label  = SLOT_LABELS[row.slot_name] || row.slot_name;
      return `<div class="map-slot ${status}">${slotEmoji(status)} ${label}</div>`;
    };

    map.innerHTML = `
      <div class="map-lane">${left.map(makeSlot).join("")}</div>
      <div class="map-road"><span class="road-arrow">↕</span></div>
      <div class="map-lane">${right.map(makeSlot).join("")}</div>
    `;
  }

  async function fetchData() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/parking_slots?select=slot_name,status,updated_at&order=slot_name.asc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();

      buildCards(rows);
      buildMap(rows);

      // Last updated from most recent row
      const latest = rows.reduce((a, b) =>
        new Date(a.updated_at) > new Date(b.updated_at) ? a : b, rows[0]);
      const ts = latest?.updated_at
        ? "Updated: " + new Date(latest.updated_at).toLocaleTimeString()
        : "Updated: " + new Date().toLocaleTimeString();
      document.getElementById("lastUpdate").textContent = ts;

      document.getElementById("connDot").className = "conn-dot ok";
      document.getElementById("connText").textContent = "Connected to Supabase";

    } catch (e) {
      document.getElementById("connDot").className = "conn-dot err";
      document.getElementById("connText").textContent = "Error — " + e.message;
    }
  }

  fetchData();
  setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
